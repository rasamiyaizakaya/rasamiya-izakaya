              items: [
                item("beer", "生啤挑戰", "1 Liter Draft Beer", "25 秒內喝完，這杯免費", "老闆敢請，你敢挑戰嗎？", "images/beer-challenge.png"),

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function readStore(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); }
    catch (e) { return null; }
  }

  function parseEmbedded() {
    try { return JSON.parse(document.getElementById("site-data").textContent); }
    catch (e) { return null; }
  }

  function normalize(source) {
    var base = source && Array.isArray(source.tabs) ? source : defaultState();
    return {
      updatedAt: base.updatedAt || 1,
      menuOrder: base.menuOrder || 0,
      fileId: base.fileId || "",
      restaurantName: base.restaurantName || "拉撒咪呀居酒屋",
      tab: base.tab === "drink" ? "drink" : "food",
      tabs: base.tabs.map(function (tab) {
        return {
          id: tab.id,
          name: tab.name,
          groups: (tab.groups || []).map(function (group) {
            return {
              id: group.id,
              name: group.name || "",
              english: group.english || "",
              note: group.note || "",
              items: (group.items || []).map(function (entry, index) {
                return {
                  id: entry.id || ("p" + index),
                  title: entry.title || "",
                  english: entry.english || "",
                  price: entry.price || "",
                  text: entry.text || "",
                  image: entry.image || "",
                  fit: entry.fit || ""
                };
              })
            };
          })
        };
      })
    };
  }

  function loadState() {
    var embedded = parseEmbedded();
    if (embedded && Array.isArray(embedded.tabs) && embedded.tabs.length) {
      storageKey = "rasamiya-menu-" + (embedded.fileId || "snapshot");
      var savedFile = readStore(storageKey);
      if (savedFile && Array.isArray(savedFile.tabs) && (savedFile.updatedAt || 0) >= (embedded.updatedAt || 0)) {
        return normalize(savedFile);
      }
      return normalize(embedded);
    }
    storageKey = EDITOR_KEY;
    var saved = readStore(storageKey);
    if (saved && Array.isArray(saved.tabs) && saved.tabs.length) return normalize(saved);
    return normalize(defaultState());
  }

  var state = loadState();

  function upgradeDrinks(current) {
    var drink = null;
    current.tabs.forEach(function (tab) {
      if (tab.id === "drink") drink = tab;
    });
    if (!drink) return;
    var hasOldList = false;
    drink.groups.forEach(function (group) {
      if (group.id === "drinks") hasOldList = true;
    });
    if (!hasOldList) return;
    var fresh = null;
    defaultState().tabs.forEach(function (tab) {
      if (tab.id === "drink") fresh = tab;
    });
    var kept = drink.groups.filter(function (group) { return group.id === "challenge"; });
    var added = fresh.groups.filter(function (group) { return group.id !== "challenge"; });
    drink.groups = added.concat(kept);
  }
  upgradeDrinks(state);

  function placeChallengeLast(current) {
    if ((current.menuOrder || 0) >= 2) return;
    current.tabs.forEach(function (tab) {
      if (tab.id !== "drink") return;
      var index = -1;
      tab.groups.forEach(function (group, i) {
        if (group.id === "challenge") index = i;
      });
      if (index >= 0 && index !== tab.groups.length - 1) {
        tab.groups.push(tab.groups.splice(index, 1)[0]);
      }
    });
    current.menuOrder = 2;
  }
  placeChallengeLast(state);

  function activeTab() {
    var found = state.tabs.filter(function (tab) { return tab.id === state.tab; })[0];
    return found || state.tabs[0];
  }

  function locate(id) {
    var t, g, index;
    for (t = 0; t < state.tabs.length; t += 1) {
      var groups = state.tabs[t].groups;
      for (g = 0; g < groups.length; g += 1) {
        index = -1;
        groups[g].items.forEach(function (entry, itemIndex) {
          if (entry.id === id) index = itemIndex;
        });
        if (index >= 0) return { group: groups[g], index: index };
      }
    }
    return null;
  }

  function readText(el, single) {
    var text = (el.innerText || "").replace(/\u00a0/g, " ").replace(/\n+$/g, "");
    if (single) text = text.replace(/\n/g, " ").trim();
    return text;
  }

  function insertPlain(text) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    range.deleteContents();
    var node = document.createTextNode(text);
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function setTyping(on) {
    clearTimeout(typingTimer);
    if (on) document.body.classList.add("is-typing");
    else typingTimer = setTimeout(function () { document.body.classList.remove("is-typing"); }, 160);
  }

  function bindPlain(el, onChange, single) {
    el.addEventListener("paste", function (e) {
      e.preventDefault();
      var data = e.clipboardData || window.clipboardData;
      var text = data ? data.getText ? data.getText("text/plain") : data.getData("text/plain") : "";
      if (!text && data && data.getData) text = data.getData("text/plain");
      if (single) text = text.replace(/\s+/g, " ").trim();
      insertPlain(text);
      onChange(readText(el, single));
    });
    if (single) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") e.preventDefault();
      });
    }
    el.addEventListener("input", function () { onChange(readText(el, single)); });
    el.addEventListener("focus", function () { setTyping(true); });
    el.addEventListener("blur", function () { setTyping(false); });
  }

  function writeStatus() {
    if (!editing) { statusEl.textContent = ""; return; }
    var count = 0;
    activeTab().groups.forEach(function (group) { count += group.items.length; });
    statusEl.textContent = activeTab().name + "共 " + count + " 項。" + statusNote;
  }

  function saveNow() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({
        updatedAt: state.updatedAt,
        menuOrder: state.menuOrder || 0,
        fileId: state.fileId || "",
        restaurantName: state.restaurantName,
        tab: state.tab,
        tabs: state.tabs
      }));
      statusNote = "已記在這台電腦。傳給客人時，請連 images 資料夾一起傳。";
    } catch (e) {
      statusNote = "空間不夠。請少放幾張新照片，或先把整個資料夾備份。";
    }
    writeStatus();
  }

  function touch() {
    state.updatedAt = Date.now();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 250);
  }

  function flushEditors() {
    if (brand.getAttribute("contenteditable") === "true") {
      state.restaurantName = readText(brand, true).trim() || "拉撒咪呀居酒屋";
    }
    Array.prototype.forEach.call(document.querySelectorAll(".tabs .tab"), function (button) {
      var label = button.querySelector(".tab-label");
      if (!label || label.getAttribute("contenteditable") !== "true") return;
      var id = button.getAttribute("data-tab");
      state.tabs.forEach(function (tab) {
        if (tab.id !== id) return;
        var name = readText(label, true).trim();
        if (name) tab.name = name;
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll(".group"), function (section) {
      var group = null;
      activeTab().groups.forEach(function (entry) {
        if (entry.id === section.getAttribute("data-group")) group = entry;
      });
      if (!group) return;
      var note = section.querySelector(".group-note");
      if (note && note.getAttribute("contenteditable") === "true") group.note = readText(note, false);
    });
    Array.prototype.forEach.call(list.querySelectorAll(".spread"), function (section) {
      var found = locate(section.getAttribute("data-id"));
      if (!found) return;
      var entry = found.group.items[found.index];
      var title = section.querySelector(".title");
      var english = section.querySelector(".en");
      var price = section.querySelector(".price");
      var body = section.querySelector(".body");
      if (title && title.getAttribute("contenteditable") === "true") entry.title = readText(title, true);
      if (english && english.getAttribute("contenteditable") === "true") entry.english = readText(english, true);
      if (price && price.getAttribute("contenteditable") === "true") entry.price = readText(price, true);
      if (body && body.getAttribute("contenteditable") === "true") entry.text = readText(body, false);
    });
  }

  function blankItem() {
    return item("p" + Date.now().toString(36), "新的品項", "", "", "點這裡寫介紹。", "");
  }

  function render(keepScroll) {
    var y = keepScroll === false ? 0 : window.scrollY;
    document.body.classList.toggle("is-editing", editing);
    if (document.activeElement !== brand) brand.textContent = state.restaurantName || "拉撒咪呀居酒屋";
    brand.contentEditable = editing ? "true" : "false";
    document.title = state.restaurantName || "拉撒咪呀居酒屋";
    if (editToggle) {
      editToggle.textContent = editing ? "完成" : "編輯內容";
      editToggle.setAttribute("aria-pressed", editing ? "true" : "false");
    }
    Array.prototype.forEach.call(document.querySelectorAll(".tabs .tab"), function (button) {
      var id = button.getAttribute("data-tab");
      var tab = null;
      state.tabs.forEach(function (entry) {
        if (entry.id === id) tab = entry;
      });
      button.classList.toggle("is-on", id === state.tab);
      var label = button.querySelector(".tab-label");
      if (!label) {
        label = document.createElement("span");
        label.className = "tab-label";
        button.textContent = "";
        button.appendChild(label);
      }
      var fallback = id === "drink" ? "酒飲" : "食物";
      if (document.activeElement !== label) label.textContent = (tab && String(tab.name || "").trim()) || fallback;
      label.contentEditable = editing ? "true" : "false";
      if (editing) label.setAttribute("aria-label", "分頁名稱");
      else label.removeAttribute("aria-label");
      if (label.getAttribute("data-bound")) return;
      label.setAttribute("data-bound", "1");
      bindPlain(label, function (value) {
        var current = null;
        state.tabs.forEach(function (entry) {
          if (entry.id === id) current = entry;
        });
        if (!current) return;
        current.name = value;
        touch();
        writeStatus();
      }, true);
      label.addEventListener("focus", function () {
        if (!editing || id === state.tab) return;
        flushEditors();
        state.tab = id;
        render(false);
      });
    });
    var tab = activeTab();
    chips.replaceChildren();
    tab.groups.forEach(function (group) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = group.name;
      button.addEventListener("click", function () {
        var target = document.getElementById("group-" + group.id);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      chips.appendChild(button);
    });
    list.replaceChildren();
    tab.groups.forEach(function (group, index) {
      list.appendChild(buildGroup(group, index, tab.groups.length));
    });
    writeStatus();
    window.scrollTo(0, y);
  }

  function buildGroup(group, groupIndex, groupCount) {
    var section = document.createElement("section");
    section.className = "group";
    section.id = "group-" + group.id;
    section.setAttribute("data-group", group.id);
    var head = document.createElement("div");
    head.className = "group-head";
    var title = document.createElement("h2");
    title.className = "group-title";
    title.textContent = group.name;
    head.appendChild(title);
    if (group.english) {
      var english = document.createElement("p");
      english.className = "group-en";
      english.textContent = group.english;
      head.appendChild(english);
    }
    if (editing || group.note) {
      if (editing) {
        var label = document.createElement("p");
        label.className = "field-label";
        label.textContent = "這一類的說明（點字即可修改）";
        head.appendChild(label);
      }
      var note = document.createElement("p");
      note.className = "group-note";
      note.textContent = group.note;
      if (editing) {
        note.contentEditable = "true";
        bindPlain(note, function (value) { group.note = value; touch(); }, false);
      }
      head.appendChild(note);
    }
    section.appendChild(head);
    if (editing) section.appendChild(buildGroupTools(group, groupIndex, groupCount));
    if (!group.items.length && editing) {
      var empty = document.createElement("p");
      empty.className = "group-note";
      empty.textContent = "這一類還沒有品項，可以按下面的「加一項」。";
      section.appendChild(empty);
    }
    group.items.forEach(function (entry, index) {
      section.appendChild(buildSpread(entry, index, group));
    });
    return section;
  }

  function buildSpread(entry, index, group) {
    var section = document.createElement("article");
    section.className = "spread";
    section.setAttribute("data-id", entry.id);
    var photo = document.createElement("div");
    photo.className = "photo";
    if (entry.image) {
      var img = document.createElement("img");
      img.src = entry.image;
      img.alt = entry.title || "餐點";
      if (entry.fit === "contain") {
        img.className = "contain";
        photo.classList.add("has-contain");
      }
      photo.appendChild(img);
    } else {
      var ph = document.createElement("div");
      ph.className = "ph";
      ph.textContent = state.tab === "drink" ? "酒" : "食";
      photo.appendChild(ph);
    }
    if (editing) {
      var photoBtn = document.createElement("button");
      photoBtn.type = "button";
      photoBtn.className = "photo-btn";
      var chip = document.createElement("span");
      chip.textContent = entry.image ? "更換圖片" : "加上圖片";
      photoBtn.setAttribute("aria-label", chip.textContent);
      photoBtn.appendChild(chip);
      photoBtn.addEventListener("click", function () { pickImage(entry.id); });
      photo.appendChild(photoBtn);
      photo.addEventListener("dragover", function (e) { e.preventDefault(); });
      photo.addEventListener("drop", function (e) {
        e.preventDefault();
        var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) applyImage(entry.id, file);
      });
    }
    var copy = document.createElement("div");
    copy.className = "copy";
    var inner = document.createElement("div");
    inner.className = "copy-inner";
    var num = document.createElement("p");
    num.className = "num";
    num.textContent = String(index + 1).padStart(2, "0");
    var title = document.createElement("h3");
    title.className = "title";
    title.textContent = entry.title;
    var english = document.createElement("p");
    english.className = "en";
    english.textContent = entry.english;
    var price = document.createElement("p");
    price.className = "price";
    price.textContent = entry.price;
    var body = document.createElement("p");
    body.className = "body";
    body.textContent = entry.text;
    inner.appendChild(num);
    if (editing) appendLabel(inner, "名稱");
    inner.appendChild(title);
    if (editing || entry.english) {
      if (editing) appendLabel(inner, "英文");
      inner.appendChild(english);
    }
    if (editing || entry.price) {
      if (editing) appendLabel(inner, "價格");
      inner.appendChild(price);
    }
    if (editing || entry.text) {
      if (editing) appendLabel(inner, "補充說明");
      inner.appendChild(body);
    }
    if (editing) {
      title.contentEditable = "true";
      english.contentEditable = "true";
      price.contentEditable = "true";
      body.contentEditable = "true";
      bindPlain(title, function (value) { entry.title = value; touch(); }, true);
      bindPlain(english, function (value) { entry.english = value; touch(); }, true);
      bindPlain(price, function (value) { entry.price = value; touch(); }, true);
      bindPlain(body, function (value) { entry.text = value; touch(); }, false);
      inner.appendChild(buildTools(entry, index, group));
    }
    copy.appendChild(inner);
    section.appendChild(photo);
    section.appendChild(copy);
    return section;
  }

  function appendLabel(parent, text) {
    var label = document.createElement("p");
    label.className = "field-label";
    label.textContent = text + "（點字即可修改）";
    parent.appendChild(label);
  }

  function toolButton(label, onClick, disabled) {
    var button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.disabled = !!disabled;
    button.addEventListener("click", onClick);
    return button;
  }

  function buildTools(entry, index, group) {
    var tools = document.createElement("div");
    tools.className = "item-tools";
    var last = group.items.length - 1;
    tools.appendChild(toolButton("最上", function () { moveItem(entry.id, "start"); }, index === 0));
    tools.appendChild(toolButton("上移", function () { moveItem(entry.id, "up"); }, index === 0));
    tools.appendChild(toolButton("下移", function () { moveItem(entry.id, "down"); }, index === last));
    tools.appendChild(toolButton("最下", function () { moveItem(entry.id, "end"); }, index === last));
    tools.appendChild(toolButton("下面加一項", function () { addAfter(entry.id); }, false));
    if (entry.image) tools.appendChild(toolButton("移除圖片", function () { clearImage(entry.id); }, false));
    tools.appendChild(toolButton("刪除這項", function () { removeItem(entry.id); }, false));
    return tools;
  }

  function moveWithin(list, index, where) {
    var next = index;
    if (where === "up") next = index - 1;
    else if (where === "down") next = index + 1;
    else if (where === "start") next = 0;
    else if (where === "end") next = list.length - 1;
    if (next === index || next < 0 || next >= list.length) return false;
    list.splice(next, 0, list.splice(index, 1)[0]);
    return true;
  }

  function locateGroup(id) {
    var t, g;
    for (t = 0; t < state.tabs.length; t += 1) {
      var groups = state.tabs[t].groups;
      for (g = 0; g < groups.length; g += 1) {
        if (groups[g].id === id) return { groups: groups, index: g };
      }
    }
    return null;
  }

  function buildGroupTools(group, index, count) {
    var tools = document.createElement("div");
    tools.className = "group-tools";
    var last = count - 1;
    tools.appendChild(toolButton("這一區最上", function () { moveGroup(group.id, "start"); }, index === 0));
    tools.appendChild(toolButton("這一區上移", function () { moveGroup(group.id, "up"); }, index === 0));
    tools.appendChild(toolButton("這一區下移", function () { moveGroup(group.id, "down"); }, index === last));
    tools.appendChild(toolButton("這一區最下", function () { moveGroup(group.id, "end"); }, index === last));
    return tools;
  }

  function moveGroup(id, where) {
    flushEditors();
    var found = locateGroup(id);
    if (!found || !moveWithin(found.groups, found.index, where)) return;
    touch();
    render();
    var el = document.getElementById("group-" + id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function moveItem(id, where) {
    flushEditors();
    var found = locate(id);
    if (!found || !moveWithin(found.group.items, found.index, where)) return;
    touch();
    render();
    var el = document.querySelector('[data-id="' + id + '"]');
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function addAfter(id) {
    flushEditors();
    var found = locate(id);
    if (!found) return;
    var created = blankItem();
    found.group.items.splice(found.index + 1, 0, created);
    touch();
    render();
    var el = document.querySelector('[data-id="' + created.id + '"]');
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function addAtEnd() {
    flushEditors();
    var groups = activeTab().groups;
    var group = groups[groups.length - 1];
    var created = blankItem();
    group.items.push(created);
    touch();
    render();
    var el = document.querySelector('[data-id="' + created.id + '"]');
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function removeItem(id) {
    var found = locate(id);
    if (!found) return;
    var name = found.group.items[found.index].title || "這一項";
    if (!confirm("確定刪除「" + name + "」？")) return;
    found.group.items.splice(found.index, 1);
    touch();
    render();
  }

  function clearImage(id) {
    var found = locate(id);
    if (!found || !found.group.items[found.index].image) return;
    if (!confirm("拿掉這張圖片？")) return;
    found.group.items[found.index].image = "";
    touch();
    render();
  }

  function isImage(file) {
    if (file.type && file.type.indexOf("image/") === 0) return true;
    return /\.(jpe?g|png|webp|gif)$/i.test(file.name || "");
  }

  function loadImageEl(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("load")); };
      img.src = url;
    });
  }

  function loadSource(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: "from-image" }).catch(function () {
        return loadImageEl(file);
      });
    }
    return loadImageEl(file);
  }

  function fileToImage(file) {
    return loadSource(file).then(function (source) {
      var maxSide = 1600;
      var scale = Math.min(1, maxSide / Math.max(source.width, source.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(source.width * scale));
      canvas.height = Math.max(1, Math.round(source.height * scale));
      var ctx = canvas.getContext("2d", { alpha: false });
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
      if (source.close) source.close();
      var quality = 0.82;
      var url = canvas.toDataURL("image/jpeg", quality);
      while (url.length > 700000 && quality > 0.5) {
        quality -= 0.08;
        url = canvas.toDataURL("image/jpeg", quality);
      }
      return url;
    });
  }

  function applyImage(id, file) {
    var found = locate(id);
    if (!found) return;
    if (!isImage(file)) { alert("請選擇圖片檔，例如 JPG 或 PNG。"); return; }
    statusNote = "圖片處理中…";
    writeStatus();
    fileToImage(file).then(function (url) {
      found.group.items[found.index].image = url;
      touch();
      render();
    }).catch(function () {
      alert("這張圖片沒辦法讀取，請改用 JPG 或 PNG。");
      statusNote = "圖片沒有換成功。";
      writeStatus();
    });
  }

  function pickImage(id) {
    pickingId = id;
    fileInput.value = "";
    fileInput.click();
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[ch];
    });
  }

  function buildDownloadHtml(hideEditor) {
    flushEditors();
    var snapshot = clone(state);
    snapshot.fileId = "f" + Date.now().toString(36);
    snapshot.updatedAt = Date.now();
    var style = document.getElementById("app-style").textContent;
    var logic = document.getElementById("app-script").textContent;
    if (!style || !logic) throw new Error("empty");
    var data = JSON.stringify(snapshot).replace(/</g, "\\u003c");
    var title = escapeHtml(snapshot.restaurantName || "拉撒咪呀居酒屋");
    var button = hideEditor ? "" : '<button type="button" id="editToggle" class="edit-toggle">編輯內容</button>';
    return "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n"
      + "<meta charset=\"utf-8\">\n"
      + "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n"
      + "<meta name=\"theme-color\" content=\"#24362f\">\n"
      + "<title>" + title + "</title>\n"
      + "<style id=\"app-style\">" + style + "</style>\n</head>\n<body>\n"
      + "<div class=\"sticky-head\"><header class=\"topbar\"><div class=\"brand-wrap\">"
      + "<p class=\"brand-label\">餐廳名稱（點字即可修改）</p>"
      + "<h1 id=\"brand\" class=\"brand\" aria-label=\"餐廳名稱\"></h1></div>"
      + button + "</header>"
      + "<div class=\"quick\"><a href=\"https://maps.app.goo.gl/XQ9icxjaansuzrmB9\" target=\"_blank\" rel=\"noopener\">Google 地圖</a>"
      + "<a href=\"https://www.instagram.com/rasamiyaizakaya/\" target=\"_blank\" rel=\"noopener\">Instagram</a></div>"
      + "<p class=\"tabs-hint\">分頁名稱（點字即可修改）</p>"
      + "<div class=\"tabs\" id=\"tabs\" role=\"tablist\"><div class=\"tab\" data-tab=\"food\" role=\"tab\" tabindex=\"0\"><span class=\"tab-label\">食物 Food</span></div>"
      + "<div class=\"tab\" data-tab=\"drink\" role=\"tab\" tabindex=\"0\"><span class=\"tab-label\">酒飲 Drink</span></div></div>"
      + "<div class=\"chips\" id=\"chips\"></div></div>\n"
      + "<main id=\"list\" aria-label=\"菜單\"></main>\n"
      + "<div class=\"editbar\" id=\"editbar\"><p class=\"status\" id=\"status\" aria-live=\"polite\"></p>"
      + "<label class=\"check\"><input type=\"checkbox\" id=\"hideEdit\" checked>給客人的檔案隱藏編輯按鈕</label>"
      + "<div class=\"edit-actions\"><button type=\"button\" id=\"downloadBtn\">下載網頁</button>"
      + "<button type=\"button\" id=\"addBtn\">加一項</button>"
      + "<button type=\"button\" id=\"resetBtn\">恢復菜單</button></div></div>\n"
      + "<input id=\"file\" type=\"file\" accept=\"image/*\" hidden>\n"
      + "<script id=\"site-data\" type=\"application/json\">" + data + "<" + "/script>\n"
      + "<script id=\"app-script\">" + logic + "<" + "/script>\n"
      + "</body>\n</html>\n";
  }

  function downloadPage() {
    var hide = hideEdit ? hideEdit.checked : false;
    var html;
    try { html = buildDownloadHtml(hide); }
    catch (e) { alert("這個頁面沒辦法下載。請用原本的「開啟網頁」重新打開。"); return; }
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    var name = (state.restaurantName || "拉撒咪呀居酒屋").replace(/[\\/:*?"<>|]/g, "").trim() || "拉撒咪呀居酒屋";
    link.href = url;
    link.download = name + ".html";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    statusNote = "已下載。這個檔案要和 images 資料夾放在一起，照片才看得到。";
    writeStatus();
  }

  function resetSample() {
    if (!confirm("恢復成簡報上的菜單？你改過的文字和圖片都會清掉。")) return;
    var fresh = normalize(defaultState());
    fresh.updatedAt = Date.now();
    fresh.fileId = state.fileId || "";
    fresh.tab = state.tab;
    state = fresh;
    touch();
    saveNow();
    statusNote = "已恢復菜單。";
    render(false);
  }

  bindPlain(brand, function (value) {
    state.restaurantName = value;
    document.title = value || "拉撒咪呀居酒屋";
    touch();
  }, true);

  Array.prototype.forEach.call(document.querySelectorAll(".tabs .tab"), function (button) {
    button.addEventListener("click", function () {
      var id = button.getAttribute("data-tab");
      if (id === state.tab) return;
      if (editing) flushEditors();
      state.tab = id;
      render(false);
    });
    button.addEventListener("keydown", function (e) {
      if (editing || (e.key !== "Enter" && e.key !== " ")) return;
      e.preventDefault();
      state.tab = button.getAttribute("data-tab");
      render(false);
    });
  });
  if (editToggle) {
    editToggle.addEventListener("click", function () {
      if (editing) flushEditors();
      editing = !editing;
      if (!editing && !String(state.restaurantName || "").trim()) state.restaurantName = "拉撒咪呀居酒屋";
      if (!editing) {
        state.tabs.forEach(function (tab) {
          if (!String(tab.name || "").trim()) tab.name = tab.id === "drink" ? "酒飲" : "食物";
        });
      }
      render();
    });
  }
  if (downloadBtn) downloadBtn.addEventListener("click", downloadPage);
  if (addBtn) addBtn.addEventListener("click", addAtEnd);
  if (resetBtn) resetBtn.addEventListener("click", resetSample);
  if (hideEdit) {
    var savedHide = localStorage.getItem(HIDE_KEY);
    hideEdit.checked = savedHide === null ? true : savedHide === "1";
    hideEdit.addEventListener("change", function () {
      localStorage.setItem(HIDE_KEY, hideEdit.checked ? "1" : "0");
    });
  }
  if (fileInput) {
    fileInput.addEventListener("change", function () {
      var file = fileInput.files && fileInput.files[0];
      var id = pickingId;
      fileInput.value = "";
      if (file && id) applyImage(id, file);
    });
  }

  render();
})();
</script>
</body>
</html>
